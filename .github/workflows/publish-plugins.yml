name: Publish Plugin

# Triggered by tags matching: <provider-name>-v<version>
# Examples: netflix-v1.0.0, hulu-v2.1.3, anime-v1.0.0-beta1
on:
  push:
    tags:
      - '*-v[0-9]*'

jobs:
  publish:
    name: Build & Release Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create GitHub Releases and push manifest updates

    steps:
      # ── 1. Parse tag ──────────────────────────────────────────────────────
      - name: Parse tag into provider name & version
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Split "netflix-v1.0.0"  → PROVIDER=netflix  VERSION=1.0.0
          PROVIDER="${TAG%-v*}"
          VERSION="${TAG#*-v}"
          echo "provider=$PROVIDER"   >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"             >> "$GITHUB_OUTPUT"
          echo "module=jarvis-provider/plugins/${PROVIDER}-provider" >> "$GITHUB_OUTPUT"

      # ── 2. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so we can push the manifest commit

      # ── 3. Java & Gradle setup ────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x jarvis-provider/gradlew

      # ── 4. Build plugin JAR ───────────────────────────────────────────────
      - name: Build ${{ steps.parse.outputs.provider }}-provider
        working-directory: jarvis-provider
        run: |
          ./gradlew :plugins:${{ steps.parse.outputs.provider }}-provider:shadowJar \
            -Pjarvis.pluginVersion=${{ steps.parse.outputs.version }}

      # ── 5. Locate JAR & compute checksum ─────────────────────────────────
      - name: Locate JAR and compute SHA-256
        id: artifact
        run: |
          PROVIDER="${{ steps.parse.outputs.provider }}"
          VERSION="${{ steps.parse.outputs.version }}"

          JAR_PATH=$(find "${{ steps.parse.outputs.module }}/build/libs" \
                       -name "${PROVIDER}-provider-*.jar" | head -n1)

          if [[ -z "$JAR_PATH" ]]; then
            echo "❌ JAR not found in ${{ steps.parse.outputs.module }}/build/libs"
            ls "${{ steps.parse.outputs.module }}/build/libs/" || true
            exit 1
          fi

          CHECKSUM=$(sha256sum "$JAR_PATH" | awk '{print $1}')
          SIZE=$(wc -c < "$JAR_PATH" | tr -d ' ')

          echo "jar_path=$JAR_PATH"   >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM"   >> "$GITHUB_OUTPUT"
          echo "size=$SIZE"           >> "$GITHUB_OUTPUT"

          echo "📦 JAR      : $JAR_PATH"
          echo "🔐 SHA-256  : $CHECKSUM"
          echo "📏 Size     : $SIZE bytes"

      # ── 6. Create GitHub Release & upload JAR ─────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse.outputs.tag }}
          name: "${{ steps.parse.outputs.provider }} provider v${{ steps.parse.outputs.version }}"
          body: |
            ## ${{ steps.parse.outputs.provider }} Provider v${{ steps.parse.outputs.version }}

            **SHA-256:** `${{ steps.artifact.outputs.checksum }}`
            **Size:** ${{ steps.artifact.outputs.size }} bytes

            Install this plugin in Jarvis via **Settings → Plugins → Check for updates**.
          files: ${{ steps.artifact.outputs.jar_path }}
          fail_on_unmatched_files: true

      # ── 7. Update public/plugins.json ────────────────────────────────────
      - name: Update plugins manifest
        env:
          GITHUB_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.parse.outputs.tag }}
        run: |
          chmod +x jarvis-provider/scripts/generate-manifest.sh
          ./jarvis-provider/scripts/generate-manifest.sh \
            "${{ steps.parse.outputs.provider }}" \
            "${{ steps.parse.outputs.version }}" \
            "${{ steps.artifact.outputs.jar_path }}"

      # ── 8. Commit & push updated manifest ────────────────────────────────
      - name: Commit manifest update
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

          git add public/plugins.json
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "chore: update plugins.json for ${{ steps.parse.outputs.provider }}-v${{ steps.parse.outputs.version }} [skip ci]"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
